<div class="portal portal--v3 portal--noite">

  <main class="paineis">

    <section class="painel">
      <div class="painel__cabeca">
        <span class="painel__marca" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 13h18l-2-5H5Z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
        </span>
        <div>
          <h2 class="painel__titulo">Identificar veículo</h2>
          <p class="painel__sub">Introduza os dados do veículo para uma pesquisa mais precisa.</p>
        </div>
      </div>
      <div class="painel__corpo">
        <div class="campo">
          <label class="campo__label" for="v3-matricula">Matrícula <span class="campo__contador">(0 / 500)</span></label>
          <div class="campo__caixa">
            <span class="campo__chip campo__chip--pais" aria-hidden="true">P</span>
            <input class="input" id="v3-matricula" placeholder="Introduza a matrícula">
          </div>
        </div>
        <div class="campo">
          <label class="campo__label" for="v3-chassi">N.º de chassis</label>
          <input class="input" id="v3-chassi" placeholder="Introduza o n.º de chassis">
        </div>
        <div class="campo">
          <label class="campo__label" for="v3-descricao">Descrição</label>
          <input class="input" id="v3-descricao" placeholder="Introduza a descrição">
        </div>
        <div class="campo">
          <label class="campo__label" for="v3-motor">Motor</label>
          <input class="input" id="v3-motor" placeholder="Introduza o motor">
        </div>
      </div>
      <div class="painel__pe">
        <button type="button" class="btn btn--ghost">
          <svg class="btn__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>
          Filtros</button>
        <button type="button" class="btn btn--acao">
          <svg class="btn__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
          Pesquisar
        </button>
      </div>
    </section>

    <section class="painel">
      <div class="painel__cabeca">
        <span class="painel__marca" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 13h18l-2-5H5Z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
        </span>
        <div>
          <h2 class="painel__titulo">Selecionar veículo</h2>
          <p class="painel__sub">Navegue pelas características do veículo.</p>
        </div>
      </div>
      <div class="painel__corpo">
        <div class="campo">
          <label class="campo__label" for="v3-tipo">Tipo de veículo</label>
          <div class="campo__caixa">
            <span class="campo__chip" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 12h16l-2-5H6Z"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg>
            </span>
            <select class="input" id="v3-tipo"><option>Automóvel ligeiro</option></select>
          </div>
        </div>
        <div class="campo">
          <label class="campo__label" for="v3-marca">Marca</label>
          <div class="campo__caixa">
            <span class="campo__chip" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12.5 11 4h9v9l-8.5 8.5Z"/><circle cx="16" cy="8" r="1.4"/></svg>
            </span>
            <select class="input" id="v3-marca"><option>Selecione marca</option></select>
          </div>
        </div>
        <div class="campo">
          <label class="campo__label" for="v3-modelo">Modelo</label>
          <div class="campo__caixa">
            <span class="campo__chip" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/></svg>
            </span>
            <select class="input" id="v3-modelo" disabled><option>Selecione modelo</option></select>
          </div>
        </div>
        <div class="campo">
          <label class="campo__label" for="v3-veiculo">Veículo</label>
          <div class="campo__caixa">
            <span class="campo__chip" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 12h16l-2-5H6Z"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg>
            </span>
            <select class="input" id="v3-veiculo" disabled><option>Selecione veículo</option></select>
          </div>
        </div>
      </div>
      <div class="painel__pe">
        <button type="button" class="btn btn--ghost">
          <svg class="btn__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          Pesq. avançada
        </button>
        <button type="button" class="btn btn--acao">
          <svg class="btn__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/></svg>
          Selecionar
        </button>
      </div>
    </section>

    <section class="painel">
      <div class="painel__cabeca painel__cabeca--acao">
        <span class="painel__marca" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
        </span>
        <div>
          <h2 class="painel__titulo">Pesquisar referências</h2>
          <p class="painel__sub">Pesquise por referência da peça, aplicável a várias marcas.</p>
        </div>
      </div>
      <div class="painel__corpo">
        <div class="campo">
          <label class="campo__label" for="v3-referencia">Referência</label>
          <div class="campo__caixa">
            <span class="campo__chip" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5v14M9 5v14M13 5v14M17 5v14M20 5v14"/></svg>
            </span>
            <input class="input" id="v3-referencia" placeholder="Introduza a referência">
          </div>
        </div>
        <div class="opcoes">
          <div class="opcao"><input type="radio" name="v3-origem" id="v3-iam"><label class="opcao__texto" for="v3-iam">IAM</label></div>
          <div class="opcao"><input type="radio" name="v3-origem" id="v3-oe"><label class="opcao__texto" for="v3-oe">OE</label></div>
          <div class="opcao"><input type="radio" name="v3-origem" id="v3-todas" checked><label class="opcao__texto" for="v3-todas">Todas</label></div>
        </div>
        <div class="opcoes">
          <div class="opcao"><input type="checkbox" id="v3-equivalencias" checked><label class="opcao__texto" for="v3-equivalencias">Incluir equivalências</label></div>
          <div class="opcao"><input type="checkbox" id="v3-parcial"><label class="opcao__texto" for="v3-parcial">Pesquisa parcial</label></div>
        </div>
      </div>
      <div class="painel__pe">
        <button type="button" class="btn btn--ghost">
          <svg class="btn__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          Pesq. avançada
        </button>
        <button type="button" class="btn btn--acao">
          <svg class="btn__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
          Pesquisar
        </button>
      </div>
    </section>

  </main>

</div>
