<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecrãs Romafe</title>
<meta name="description" content="Todos os ecrãs da Romafe num só sítio: ERP, WebShop, MarketPlace e Mobile.">
<script>try{var t=localStorage.getItem("uiux:tema");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<main class="hub">
  <header class="hub__cabeca">
    <div>
      <h1 class="hub__titulo">Ecrãs Romafe</h1>
      <p class="hub__sub">ERP, WebShop, MarketPlace e Mobile num só sítio. Escolhe a app ou procura o ecrã.</p>
    </div>
    <div class="segmented" role="group" aria-label="Tema">
      <button type="button" class="segmented__btn" data-tema="light">Claro</button>
      <button type="button" class="segmented__btn" data-tema="dark">Escuro</button>
      <button type="button" class="segmented__btn" data-tema="auto">Auto</button>
    </div>
  </header>

  <label class="sr-only" for="procura">Procurar um ecrã</label>
  <input class="procura" id="procura" type="search" placeholder="Procurar um ecrã: palavra-passe, federado, entrar…" autocomplete="off">

  <section class="apps" id="apps" aria-label="As apps"></section>
  <section id="resultados" aria-live="polite"></section>
</main>
<script type="module" src="/src/hub/main.ts"></script>
</body>
</html>
